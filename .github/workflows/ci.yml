name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test (unit + e2e without DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm run test
        env:
          CI: 'true'

  test-e2e:
    name: Test (e2e with MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run e2e tests
        run: npm run test:e2e --workspace=server
        env:
          CI: 'true'
          MONGODB_URI: 'mongodb://localhost:27017/habitarena_test'
          JWT_SECRET: 'e2e-test-access-secret'
          JWT_REFRESH_SECRET: 'e2e-test-refresh-secret'

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck server
        run: npx tsc --noEmit --project server/tsconfig.json

      - name: Typecheck client
        run: npx tsc --noEmit --project client/tsconfig.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, test-e2e, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build client
        run: npm run build --workspace=client
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

      - name: Build server
        run: npm run build --workspace=server
